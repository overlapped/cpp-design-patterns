name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.sanitize || 'plain' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++-14
            cc: gcc-14
            preset: release
            sanitize: ""
          - os: ubuntu-latest
            compiler: gcc
            cxx: g++-14
            cc: gcc-14
            preset: ci-asan
            sanitize: "address,undefined"
          - os: ubuntu-latest
            compiler: clang
            cxx: clang++-18
            cc: clang-18
            preset: ci-asan
            sanitize: "address,undefined"

    steps:
      - uses: actions/checkout@v4

      - name: Install compilers and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-18 ninja-build cmake

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: Test (with sanitizers when enabled)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }} --output-on-failure